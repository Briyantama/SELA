version: v2
# Generated code is committed under gen/go. Run scripts/proto-gen.sh to regenerate.
# Plugins are resolved from PATH (install: go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
# and google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest).
plugins:
  - local: protoc-gen-go
    out: .
    opt:
      - module=github.com/Briyantama/SELA
  - local: protoc-gen-go-grpc
    out: .
    opt:
      - module=github.com/Briyantama/SELA
